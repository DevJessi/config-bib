name: bibliotecaprs

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PG_USUARIO}
      POSTGRES_PASSWORD: ${PG_SENHA}
      POSTGRES_DB: ${PG_NOMEBANCO}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    init: true
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${PG_USUARIO}:${PG_SENHA}@db:5432/${PG_NOMEBANCO}
    ports:
      - "3000:3000"
    volumes:
      - ./api/src:/app/src
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: