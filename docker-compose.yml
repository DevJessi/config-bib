x-backend-image: &backend-image
  image: ${BACKEND_IMAGE:-biblioteca-backend:local}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    shm_size: 256mb

    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example}
      POSTGRES_USER: ${POSTGRES_USER:-bib01}
      POSTGRES_DB: ${POSTGRES_DB:-biblioteca}

    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-network

  migrate:
    <<: *backend-image
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-bib01}:${POSTGRES_PASSWORD:-example}@db:5432/${POSTGRES_DB:-biblioteca}
    command: ["npm", "run", "migrations:migrate"]
    restart: "no"
    init: true
    networks:
      - app-network

  backend:
    <<: *backend-image
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-bib01}:${POSTGRES_PASSWORD:-example}@db:5432/${POSTGRES_DB:-biblioteca}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      PRAZO_EMPRESTIMO_DIAS: ${PRAZO_EMPRESTIMO_DIAS:-15}
      MULTA_POR_DIA: ${MULTA_POR_DIA:-1}
      LIMITE_BLOQUEIO_MULTA: ${LIMITE_BLOQUEIO_MULTA:-20}
      RESERVA_DIAS_RETIRADA: ${RESERVA_DIAS_RETIRADA:-3}
      MAX_RENOVACOES: ${MAX_RENOVACOES:-2}
      LEMBRETES_HORA: ${LEMBRETES_HORA:-8}
      LEMBRETES_INTERVALO_MIN: ${LEMBRETES_INTERVALO_MIN:-15}
      EMAIL_USUARIO: ${EMAIL_USUARIO:-}
      EMAIL_SENHA: ${EMAIL_SENHA:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8443}
      CORS_ORIGIN: ${CORS_ORIGIN:-}

    ports:
      - "127.0.0.1:${APP_PORT:-3000}-${APP_PORT_MAX:-3010}:${PORT:-3000}"
    command: ["node", "main.js"]
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.js"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

    networks:
      - app-network

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    networks:
      - app-network

volumes:
  pg_data:

networks:
  app-network:
    driver: bridge
