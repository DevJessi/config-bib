name: quality

on
  pull_request:
    branches: []
  push:
    branches: []

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
        run: npm ci
        working-directory: backend
        run: node --check main.js && node --check app.js && node --check routes/leitores.routes.js && node --check services/livroService.js
        working-directory: backend
        run: npm test
        working-directory: backend
        run: npm run test:coverage
        working-directory: backend
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: warn
          retention-days: 7